name: Build Phoenix Leecher

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file exe
        run: >
          dotnet publish src/PhoenixLeecher/PhoenixLeecher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixLeecher-win-x64
          path: publish/PhoenixLeecher.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/PhoenixLeecher.exe
          body: |
            Phoenix Leecher ${{ github.ref_name }} — Windows single-file exe.
            Unsigned: Windows SmartScreen "Unknown publisher" warning is expected.
